{% set python_min = "3.11" %}
{% set name = "patool" %}
{% set version = "4.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/patool-{{ version }}.tar.gz
  sha256: e7f62d222f4a8a6c48dbfb38056dc7f9e5778ccc07c1f16d9653a316812f83ba

build:
  entry_points:
    - patool = patoolib.cli:main_cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools_reproducible
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - patoolib
  commands:
    - pip check
    - patool --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: http://wummel.github.io/patool/
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: patool is a portable command line archive file manager
  dev_url: https://github.com/wummel/patool

extra:
  recipe-maintainers:
    - notestaff
    - ocefpaf
